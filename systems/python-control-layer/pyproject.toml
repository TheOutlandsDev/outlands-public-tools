[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "python-control-layer"
version = "0.1.0"
description = "Local health-service foundation for a data and query control layer"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.163.1",
  "pydantic-settings==2.16.3",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
