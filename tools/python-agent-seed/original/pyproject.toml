[project]
name = "public-python-agent-seed"
version = "0.1.0"
description = "First-run seed pack for a Python coding agent knowledge base"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = [
  "S101"
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
