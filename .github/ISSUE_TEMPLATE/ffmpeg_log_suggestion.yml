name: "FFmpeg Capture Log Inspector: Suggestion"
description: "Share a reproducible problem or improvement with fictional data."
title: "[ffmpeg-log] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Use generated examples you have rights to contribute. Do not attach real capture logs, device names, private paths, URLs, keys or media."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Fictional example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, runtime version and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private information and have rights to the example."
          required: true
