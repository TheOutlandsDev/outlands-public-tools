name: "Mod Profile Activation Manager: Bug report"
description: "Share a problem or improvement using disposable fictional profiles."
title: "[mod-profile] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Use fictional files and stores you have rights to share. Do not attach game/mod assets, actual profiles, private journals, identifiers, customer data or credentials."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal fictional example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, Python/Tk version and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private data and have rights to the example."
          required: true
