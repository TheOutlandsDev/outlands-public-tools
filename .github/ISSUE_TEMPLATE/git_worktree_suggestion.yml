name: "Git Worktree Review Reporter: Suggestion"
description: "Share a problem or improvement using minimal fictional examples."
title: "[git-worktree] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Use generated fixtures and source snippets you have rights to contribute. Do not attach real status reports, remote URLs, branch names, private paths, credentials or repository contents."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Fictional example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, runtime/library versions and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private data and have rights to the example."
          required: true
