name: "Offline Session Telemetry Analyzer: Bug report"
description: "Share a problem or improvement using a minimal fictional fixture."
title: "[session-telemetry] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Use fictional examples you have rights to share. Do not attach real telemetry, game assets, proprietary patch plans, vendor configuration, credentials, customer data or identifying reports."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal fictional example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, Python version and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private data and have rights to the example."
          required: true
