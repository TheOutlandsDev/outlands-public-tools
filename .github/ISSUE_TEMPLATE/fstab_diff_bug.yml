name: "Fstab Configuration Diff: Bug report"
description: "Share a problem or improvement using minimal fictional configuration text."
title: "[fstab-diff] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Do not attach real firmware, device identifiers, credentials, private paths or unredacted reports. Contribute only examples you have rights to share."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal fictional example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, Python version and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private data and have rights to the example."
          required: true
