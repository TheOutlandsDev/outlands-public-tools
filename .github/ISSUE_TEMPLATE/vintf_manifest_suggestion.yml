name: "Android VINTF Manifest Inspector: Suggestion"
description: "Share a problem or improvement using minimal generated metadata."
title: "[vintf-manifest] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Use fictional metadata/generators you have rights to share. Do not attach real images, firmware, proprietary metadata, credentials, unique identifiers or unredacted reports."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal fictional example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, Python/XML-parser version and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private data and have rights to the example."
          required: true
