name: "Desktop Network Monitor: Bug report"
description: "Share a problem or improvement with invented packet metadata."
title: "[network-monitor] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Use fictional packet metadata. Do not attach real addresses, captures, logs, API keys, interface names, customer data or unreviewed reports."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal fictional example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, Python/Tk/dependency versions and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private data and have rights to the example."
          required: true
