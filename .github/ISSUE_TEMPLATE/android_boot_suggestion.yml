name: "Boot / Vendor Boot Header Inspector: Suggestion"
description: "Share a problem or improvement with a minimal synthetic example."
title: "[android-boot] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Use fictional fixtures you have rights to share. Do not attach firmware, APKs, credentials, private identifiers, customer data or unredacted reports."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal synthetic example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, Python version and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private data and have rights to the example."
          required: true
