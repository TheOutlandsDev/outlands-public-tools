name: "ZIP Package Policy Verifier: Bug report"
description: "Share a problem or improvement with a minimal fictional example."
title: "[zip-policy] "
body:
  - type: markdown
    attributes:
      value: "Suggestions are welcome. Share generated fixtures and source snippets you have rights to contribute. Do not attach archive contents, real package recipes, private paths, keys or proprietary files."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Fictional example, steps and expected behavior"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "OS, runtime version and source commit"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report review"
      options:
        - label: "I removed private information and have rights to the example."
          required: true
