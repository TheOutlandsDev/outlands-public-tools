name: "Friendlies source preview: Suggestion"
description: "Suggest an improvement to the experimental solo source."
title: "[friendlies-preview] "
body:
  - type: markdown
    attributes:
      value: "Gameplay is unverified; Fika is blocked. Do not attach game/mod DLLs, profiles, account/session data, private addresses or unredacted logs. Core/compile results do not prove gameplay compatibility."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or proposed improvement"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Reproduction and evidence scope"
      description: "Separate source/core/compile observations from actual solo gameplay. Use fictional data and redacted evidence only."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: "Source commit, SPT/EFT, BigBrain/AI mod and SDK versions"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Public report check"
      options:
        - label: "I removed private data and included no proprietary/game/dependency files."
          required: true
