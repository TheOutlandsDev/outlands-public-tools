name: Document Template Workbench checks
on:
  push:
    paths: ['systems/document-template-workbench/**', '.github/workflows/document-template-workbench-checks.yml']
  pull_request:
    paths: ['systems/document-template-workbench/**', '.github/workflows/document-template-workbench-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-documents:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      WORKBENCH_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Application and native I/O checks
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error systems/document-template-workbench/run_checks.py
      - name: Install hash-pinned browser test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r systems/document-template-workbench/requirements-browser.txt
      - name: Install paired test Chromium and platform dependencies
        run: python -m playwright install --with-deps chromium
      - name: Real Chromium revision, preview, build, download and private handoff acceptance
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error systems/document-template-workbench/run_browser_checks.py
      - name: Browser script syntax
        run: >-
          python -B -c "from pathlib import Path; print(Path('systems/document-template-workbench/documents/ui.html').read_text(encoding='utf-8').split('<script>',1)[1].split('</script>',1)[0])" | node --check
      - name: Complete fictional workflow
        run: python -B systems/document-template-workbench/workbench.py --workspace "${{ runner.temp }}/fictional-documents-demo" demo
      - name: Pinned source inventory
        run: python -B systems/document-template-workbench/release_source.py check
      - name: Deterministic source package
        run: python -B systems/document-template-workbench/release_source.py package --output "${{ runner.temp }}/document-template-workbench-source.zip" > "${{ runner.temp }}/package-receipt.json"
      - name: Show source receipt
        run: python -B -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig').strip())" "${{ runner.temp }}/package-receipt.json"
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
      - name: Retain focused source and receipt
        uses: actions/upload-artifact@v7
        with:
          name: document-template-workbench-source-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/document-template-workbench-source.zip
            ${{ runner.temp }}/package-receipt.json
          if-no-files-found: error
          retention-days: 14

  render-fictional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install separately supplied render qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation
      - name: Render and check fictional short and multipage documents
        run: python -B -W error systems/document-template-workbench/acceptance/render_check.py --output "${{ runner.temp }}/fictional-document-render"
      - name: Retain only invented page images and neutral qualification receipt
        uses: actions/upload-artifact@v7
        with:
          name: document-template-workbench-rendered-fictional
          path: |
            ${{ runner.temp }}/fictional-document-render/qa/*.png
            ${{ runner.temp }}/fictional-document-render/qa/render-report.json
          if-no-files-found: error
          retention-days: 14
