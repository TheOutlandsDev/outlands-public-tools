name: Dataset Review portable Windows qualification
on:
  push:
    branches: ['**']
    paths: ['downloads/windows/dataset-review/**', '.github/workflows/dataset-review-portable-windows.yml']
  pull_request:
    paths: ['downloads/windows/dataset-review/**', '.github/workflows/dataset-review-portable-windows.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Archive and fictional dataset review boundaries
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -m unittest discover -s downloads/windows/dataset-review -p test_packaging.py -v
      - name: Build pinned source and official runtime
        run: python -B downloads/windows/dataset-review/build.py --output "${{ runner.temp }}/portable-package"
      - name: Install separate pinned browser test tools
        if: runner.os == 'Windows'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r systems/dataset-review/requirements-browser.txt
          python -m playwright install chromium
      - name: Fresh bundled-runtime CMD and real browser dataset acceptance
        if: runner.os == 'Windows'
        run: python -B downloads/windows/dataset-review/accept.py --packages "${{ runner.temp }}/portable-package" --workspace "${{ runner.temp }}/portable fresh download" --browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dataset-review-portable-${{ runner.os }}
          path: ${{ runner.temp }}/portable-package
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dataset-review-portable-*
          path: ${{ runner.temp }}/portable-platforms
      - name: Require byte-identical Windows ZIP and receipt
        run: |
          diff "$RUNNER_TEMP/portable-platforms/dataset-review-portable-Windows/SHA256SUMS.txt" "$RUNNER_TEMP/portable-platforms/dataset-review-portable-Linux/SHA256SUMS.txt"
          cmp "$RUNNER_TEMP/portable-platforms/dataset-review-portable-Windows/dataset-review-0.1.0-windows-x64.zip" "$RUNNER_TEMP/portable-platforms/dataset-review-portable-Linux/dataset-review-0.1.0-windows-x64.zip"
          cmp "$RUNNER_TEMP/portable-platforms/dataset-review-portable-Windows/release-receipt.json" "$RUNNER_TEMP/portable-platforms/dataset-review-portable-Linux/release-receipt.json"
  publish:
    needs: compare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: dataset-review-portable-*
          path: ${{ runner.temp }}/portable-platforms
      - name: Check publication source scope
        id: publication_scope
        run: >-
          python -B .github/ci/publish_scope.py --path 'downloads/windows/dataset-review/**'
      - name: Recheck full members and acceptance before immutable publication
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.publication_scope.outputs.publish_requested == 'true'
        run: python -B downloads/windows/dataset-review/publish.py --artifacts "$RUNNER_TEMP/portable-platforms"
