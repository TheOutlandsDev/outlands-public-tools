name: Friendlies source preview checks
on:
  push:
    paths: ['tools/friendlies/**', '.github/workflows/friendlies-checks.yml']
  pull_request:
    paths: ['tools/friendlies/**', '.github/workflows/friendlies-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/friendlies
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: python -B source_check.py
      - name: Build core fixtures without a game SDK
        run: dotnet build tests/Friendlies.Tests.csproj -c Release --artifacts-path ../../../.audit/friendlies-tests --nologo
      - name: Core fixtures and simulated plan only
        run: |
          dotnet ../../../.audit/friendlies-tests/bin/Friendlies.Tests/release/Friendlies.Tests.dll
          dotnet ../../../.audit/friendlies-tests/bin/Friendlies.Tests/release/Friendlies.Tests.dll --demo
