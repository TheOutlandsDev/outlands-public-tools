name: Offline Notification Outbox checks
on:
  push:
    branches: ['main']
    paths: ['tools/notification-outbox/**', '.github/workflows/notification-outbox-checks.yml']
  pull_request:
    paths: ['tools/notification-outbox/**', '.github/workflows/notification-outbox-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-outbox:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fictional outbox state and CLI methods
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error -c "import unittest; result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tools/notification-outbox/tests')); raise SystemExit(0 if result.wasSuccessful() and result.testsRun==45 and not result.skipped else 1)"
      - name: Built-in fictional demo
        run: python -B tools/notification-outbox/demo.py --demo
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
