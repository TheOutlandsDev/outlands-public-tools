name: Platform metadata inspector checks
on:
  push:
    branches: ['main']
    paths: ['tools/gpt-image-inspector/**', 'tools/kernel-module-inspector/**', 'tools/vintf-manifest-inspector/**', '.github/workflows/platform-inspectors-checks.yml']
  pull_request:
    paths: ['tools/gpt-image-inspector/**', 'tools/kernel-module-inspector/**', 'tools/vintf-manifest-inspector/**', '.github/workflows/platform-inspectors-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  metadata-review:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact reviewed source-only inventories
        run: |
          python -B tools/gpt-image-inspector/source_check.py
          python -B tools/kernel-module-inspector/source_check.py
          python -B tools/vintf-manifest-inspector/source_check.py
      - name: GPT metadata corruption, bounds and actual CLI fixtures
        working-directory: tools/gpt-image-inspector
        run: python -B -W error -m unittest discover -s tests -v
      - name: Module metadata ambiguity, graphs and actual CLI fixtures
        working-directory: tools/kernel-module-inspector
        run: python -B -W error -m unittest discover -s tests -v
      - name: VINTF declaration parsing, comparison and actual CLI fixtures
        working-directory: tools/vintf-manifest-inspector
        run: python -B -W error -m unittest discover -s tests -v
