name: Platform metadata inspector checks
on:
  push:
    branches: ['main']
    paths: ['tools/gpt-image-inspector/**', 'tools/kernel-module-inspector/**', 'tools/vintf-manifest-inspector/**', '.github/workflows/platform-inspectors-checks.yml']
  pull_request:
    paths: ['tools/gpt-image-inspector/**', 'tools/kernel-module-inspector/**', 'tools/vintf-manifest-inspector/**', '.github/workflows/platform-inspectors-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  metadata-review:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact reviewed source-only inventories
        run: |
          python -B tools/kernel-module-inspector/source_check.py
          python -B tools/vintf-manifest-inspector/source_check.py
      - name: Module metadata ambiguity, graphs and actual CLI fixtures
        working-directory: tools/kernel-module-inspector
        run: python -B -W error -m unittest discover -s tests -v
      - name: VINTF declaration parsing, comparison and actual CLI fixtures
        working-directory: tools/vintf-manifest-inspector
        run: python -B -W error -m unittest discover -s tests -v
  gpt-native:
    name: gpt-native (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12.16', '3.13.18', '3.14.10', '3.15.2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/gpt-image-inspector
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OUTLANDS_GPT_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - name: Verify reviewed source and prepare selected Python
        run: >-
          python -I -B packaging/prepare_python.py --version "${{ matrix.python }}"
          --out "${{ runner.temp }}/gpt-native-python" --report "${{ runner.temp }}/gpt-native-python.json" --github-env
      - name: Original 46 methods in an empty selected-Python environment
        shell: python
        run: |
          import hashlib,importlib.util,json,os,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('python_preparation',pathlib.Path('packaging/prepare_python.py'))
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          selected=os.environ['OUTLANDS_GPT_PYTHON']
          env=helper.clean_environment()
          pin=json.loads(pathlib.Path(os.environ['OUTLANDS_GPT_PYTHON_RECEIPT']).read_bytes())
          env.update(OUTLANDS_TEST_PYTHON_SHA256=pin['executable_sha256'],OUTLANDS_TEST_PYTHON_VERSION=pin['python_version'])
          subprocess.run([selected,'-I','-B','source_check.py'],env=env,check=True)
          environment=base/'gpt-native-venv'
          subprocess.run([selected,'-I','-B','-m','venv','--without-pip',str(environment)],env=env,check=True)
          python=environment/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
          subprocess.run([str(python),'-I','-B','-W','error','tests/original_support.py','--report',str(base/'gpt-native.json')],env=env,check=True)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpt-native-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/gpt-native.json
          if-no-files-found: error
