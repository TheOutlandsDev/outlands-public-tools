name: Modular ingestion control checks
on:
  push:
    branches: ['main']
    paths: ['tools/intake-mapping-diff/**', 'tools/batch-replay-planner/**', 'tools/checkpoint-progression-checker/**', 'tools/ingestion-run-coverage-checker/**', 'tools/workbook-intake-checker/**', 'tools/ingestion-receipt-reconciler/**', 'tests/test_ingestion_control_tools.py', '.github/workflows/ingestion-control-checks.yml']
  pull_request:
    paths: ['tools/intake-mapping-diff/**', 'tools/batch-replay-planner/**', 'tools/checkpoint-progression-checker/**', 'tools/ingestion-run-coverage-checker/**', 'tools/workbook-intake-checker/**', 'tools/ingestion-receipt-reconciler/**', 'tests/test_ingestion_control_tools.py', '.github/workflows/ingestion-control-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-ingestion:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Mapping differences and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/intake-mapping-diff
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Batch replay planning and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/batch-replay-planner
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Checkpoint coverage and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/checkpoint-progression-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Run coverage and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/ingestion-run-coverage-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and four-tool interoperability
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_ingestion_control_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
