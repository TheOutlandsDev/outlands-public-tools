name: Git and document asset QA checks
on:
  push:
    branches: ['main']
    paths: ['tools/git-worktree-reporter/**', 'tools/pdf-text-bounds/**', 'tools/svg-content-inspector/**', '.github/workflows/developer-qa-checks.yml']
  pull_request:
    paths: ['tools/git-worktree-reporter/**', 'tools/pdf-text-bounds/**', 'tools/svg-content-inspector/**', '.github/workflows/developer-qa-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  developer-qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify supported XML parser and select installed test Git
        shell: python
        run: |
          import os, pathlib, pyexpat, shutil, subprocess
          if tuple(pyexpat.version_info) < (2, 7, 2):
              raise SystemExit('An updated Expat parser is required; SVG tests are not skipped.')
          git = shutil.which('git')
          if not git:
              raise SystemExit('Git is required; repository fixtures are not skipped.')
          git = str(pathlib.Path(git).absolute())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('OUTLANDS_TEST_GIT=' + git + '\n')
          print('Expat ' + pyexpat.EXPAT_VERSION)
          subprocess.run([git, '--version'], check=True)
      - name: Install separately licensed pinned PDF test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all:
          -r tools/pdf-text-bounds/requirements-dev.lock.txt
      - name: Explicit maintainer check of installed pins and current PyPI advisories
        working-directory: tools/pdf-text-bounds
        run: python -B check_advisories.py
      - name: Verify exact reviewed source inventories
        run: |
          python -B tools/git-worktree-reporter/source_check.py
          python -B tools/pdf-text-bounds/source_check.py
          python -B tools/svg-content-inspector/source_check.py
      - name: Actual disposable Git repositories and parser fixtures
        working-directory: tools/git-worktree-reporter
        run: python -B -W error -m unittest discover -s tests -p test_git_reporter.py -v
      - name: Real generated PDF geometry and bounded worker fixtures
        working-directory: tools/pdf-text-bounds
        run: python -B -W error -m unittest discover -s tests -v
      - name: Prepare pinned Python with native Expat 2.10.0 for SVG
        working-directory: tools/svg-content-inspector
        run: >-
          python -B packaging/prepare_runtime.py --minor "${{ matrix.python }}"
          --out "${{ runner.temp }}/legacy-svg-runtime"
          --report "${{ runner.temp }}/legacy-svg-runtime.json"
      - name: Bounded parser preparation failure diagnostics
        if: failure()
        shell: python
        run: |
          import os,pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          runtime=base/"legacy-svg-runtime"
          for name in ('original-parser-private.log','configure-private.log','build-private.log','install-expat-private.log','configure-python-private.log','build-python-private.log','install-python-private.log','updated-parser-private.log'):
              file=runtime/name
              if not file.is_file():
                  continue
              text=file.read_text(encoding='utf-8',errors='replace')[-12000:]
              for path in (str(pathlib.Path.cwd().resolve()),str(base),str(pathlib.Path.home())):
                  text=text.replace(path,'<OWNED_PATH>')
              print(name+'\n'+text)
      - name: Bind the updated SVG interpreter
        shell: python
        run: |
          import json, os, pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          record=json.loads((base/'legacy-svg-runtime.json').read_text())
          assert record['python_pin']['expat_version']==[2,10,0]
          executable=base/'legacy-svg-runtime'/record['executable_relative']
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              out.write('OUTLANDS_SVG_PYTHON='+str(executable)+'\n')
              out.write('OUTLANDS_REQUIRE_SYMLINK_TEST=1\n')
      - name: Static SVG, XML, CSS and reference fixtures
        working-directory: tools/svg-content-inspector
        shell: python
        run: |
          import os,subprocess
          env={k:v for k,v in os.environ.items() if k.upper() not in {'LD_LIBRARY_PATH','DYLD_LIBRARY_PATH','DYLD_FALLBACK_LIBRARY_PATH'}}
          subprocess.run([os.environ['OUTLANDS_SVG_PYTHON'],'-I','-B','-W','error','-m','unittest','discover','-s','tests','-p','test_svg.py','-v'],env=env,check=True)
      - name: Fictional worktree through the actual CLI
        working-directory: tools/git-worktree-reporter
        shell: python
        run: |
          import json, os, pathlib, subprocess
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          repo, output = base / 'git-review-demo', base / 'git-review-report'
          git = os.environ['OUTLANDS_TEST_GIT']
          subprocess.run(['python', '-B', 'examples/make_demo.py', '--destination', str(repo), '--git-executable', git], check=True)
          subprocess.run(['python', '-B', 'git_worktree_report.py', '--repo', str(repo), '--git-executable', git, '--output', str(output)], check=True)
          report = json.loads((output / 'report.json').read_text(encoding='utf-8'))
          assert report['entry_count'] == 3 and report['observed_control_files_unchanged']
      - name: Generated PDFs through the actual geometry CLI
        working-directory: tools/pdf-text-bounds
        shell: python
        run: |
          import json, os, pathlib, subprocess
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          demo = base / 'pdf-bounds-demo'
          subprocess.run(['python', '-B', 'examples/make_demo.py', '--destination', str(demo)], check=True)
          for name, expected in [('inside', 0), ('outside', 1)]:
              output = base / ('pdf-bounds-' + name)
              result = subprocess.run(['python', '-B', 'pdf_bounds.py', '--pdf', str(demo / (name + '.pdf')), '--output', str(output)])
              assert result.returncode == expected
              report = json.loads((output / 'report.json').read_text(encoding='utf-8'))
              assert (report['outside_characters'] == 0) == (expected == 0)
      - name: Generated SVGs through the actual static inspector CLI
        working-directory: tools/svg-content-inspector
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          env={k:v for k,v in os.environ.items() if k.upper() not in {'LD_LIBRARY_PATH','DYLD_LIBRARY_PATH','DYLD_FALLBACK_LIBRARY_PATH'}}
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          demo = base / 'svg-inspector-demo'
          subprocess.run([os.environ['OUTLANDS_SVG_PYTHON'], '-B', 'examples/make_demo.py', '--destination', str(demo)], env=env, check=True)
          for name, expected in [('clean', 0), ('review', 1)]:
              output = base / ('svg-inspector-' + name)
              result = subprocess.run([os.environ['OUTLANDS_SVG_PYTHON'], '-B', 'svg_inspector.py', '--svg', str(demo / (name + '.svg')), '--output', str(output)],env=env)
              assert result.returncode == expected
              manifest = json.loads((output / 'MANIFEST.json').read_text(encoding='utf-8'))
              assert len(manifest['files']) == 2
              assert all((output / row['path']).stat().st_size == row['bytes'] and hashlib.sha256((output / row['path']).read_bytes()).hexdigest() == row['sha256'] for row in manifest['files'])
