name: Actions policy safeguards
on:
  push:
    branches: ['main']
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r .github/ci/requirements.txt
      - run: python -B .github/ci/check_workflows.py
      - run: python -B -m unittest discover -s .github/ci/tests -v
