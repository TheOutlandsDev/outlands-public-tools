name: Manufacturing desktop evidence contract
on:
  push:
    branches: ['main']
    paths: ['.github/ci/manufacturing_desktop_gate.py', '.github/ci/tests/test_manufacturing_desktop_gate.py', '.github/workflows/manufacturing-evidence-gate.yml']
  pull_request:
    paths: ['.github/ci/manufacturing_desktop_gate.py', '.github/ci/tests/test_manufacturing_desktop_gate.py', '.github/workflows/manufacturing-evidence-gate.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      OUTLANDS_TEST_TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Fictional fixtures only; no Windows installation or demo qualification
        run: python -B -W error -m unittest discover -s .github/ci/tests -p test_manufacturing_desktop_gate.py -v
