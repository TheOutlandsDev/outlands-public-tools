name: XML Recipe Inspector platform checks
on:
  push:
    branches: ['main']
    paths: ['tools/xml-recipe-inspector/**', '.github/workflows/xml-recipe-checks.yml']
  pull_request:
    paths: ['tools/xml-recipe-inspector/**', '.github/workflows/xml-recipe-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  platform-xml-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/xml-recipe-inspector
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OUTLANDS_XML_REQUIRE_NATIVE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Original POSIX regression unchanged
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tests -p test_xml_recipe_inspector.py -v
      - name: Portable contracts and native Windows fixtures
        run: python -B -m unittest discover -s tests -p test_xml_windows.py -v
      - name: Documentation and JSON syntax
        working-directory: .
        run: python -B tools/documentation-check/docs_check.py --root .
