name: Modular review and change integrity checks
on:
  push:
    branches: ['main']
    paths: ['tools/review-queue-contract-checker/**', 'tools/correction-lineage-checker/**', 'tools/approval-scope-checker/**', 'tools/change-impact-planner/**', 'tests/test_review_change_tools.py', '.github/workflows/review-change-checks.yml']
  pull_request:
    paths: ['tools/review-queue-contract-checker/**', 'tools/correction-lineage-checker/**', 'tools/approval-scope-checker/**', 'tools/change-impact-planner/**', 'tests/test_review_change_tools.py', '.github/workflows/review-change-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-review-change:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Review queue contracts and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/review-queue-contract-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Correction lineage and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/correction-lineage-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Approval scopes and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/approval-scope-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Change impact and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/change-impact-planner
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and four-tool interoperability
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_review_change_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
