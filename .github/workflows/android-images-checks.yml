name: Android image and package metadata checks
on:
  push:
    branches: ['main']
    paths: ['tools/android-sparse-inspector/**', 'tools/android-boot-inspector/**', 'tools/apk-report-diff/**', '.github/workflows/android-images-checks.yml']
  pull_request:
    paths: ['tools/android-sparse-inspector/**', 'tools/android-boot-inspector/**', 'tools/apk-report-diff/**', '.github/workflows/android-images-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  android-images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate existing source suites without Python packages
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-source-venv'
          assert not root.exists() and root.parent.is_dir()
          subprocess.run([sys.executable,'-I','-B','-m','venv','--without-pip',str(root)],check=True)
          scripts=root/('Scripts' if os.name=='nt' else 'bin')
          with pathlib.Path(os.environ['GITHUB_PATH']).open('a',encoding='utf-8') as output:
              output.write(str(scripts)+'\n')
          executable=root/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
          probe="import hashlib,importlib.metadata,json,pathlib,sys; p=pathlib.Path(sys._base_executable).resolve(); print(json.dumps(dict(version=sys.version.split()[0],sha256=hashlib.sha256(p.read_bytes()).hexdigest(),fresh=sys.prefix!=sys.base_prefix,distributions=len(list(importlib.metadata.distributions())))))"
          actual=json.loads(subprocess.check_output([str(executable),'-I','-B','-c',probe],text=True))
          assert actual['fresh'] and actual['distributions']==0 and actual['version']==sys.version.split()[0]
          assert actual['sha256']==hashlib.sha256(pathlib.Path(sys._base_executable).resolve().read_bytes()).hexdigest()
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as output:
              output.write('OUTLANDS_TEST_PYTHON_SHA256='+actual['sha256']+chr(10))
              output.write('OUTLANDS_TEST_PYTHON_VERSION='+actual['version']+chr(10))
              output.write('OUTLANDS_SPARSE_REQUIRE_LINKS=1'+chr(10))
      - name: Verify exact reviewed source-only inventories
        run: |
          python -B tools/android-sparse-inspector/source_check.py
          python -B tools/android-boot-inspector/source_check.py
          python -B tools/apk-report-diff/source_check.py
      - name: Sparse chunk layout, bounded reads and actual CLI fixtures
        working-directory: tools/android-sparse-inspector
        run: python -B -W error -m unittest discover -s tests -v
      - name: Boot and vendor boot layouts and actual CLI fixtures
        working-directory: tools/android-boot-inspector
        run: python -B -W error -m unittest discover -s tests -v
      - name: Saved APK badging metadata and actual CLI fixtures
        working-directory: tools/apk-report-diff
        run: python -B -W error -m unittest discover -s tests -v
  sparse-native:
    name: sparse-native (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12.16', '3.13.18', '3.14.10', '3.15.2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/android-sparse-inspector
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OUTLANDS_SPARSE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - name: Verify reviewed source and prepare selected Python
        run: >-
          python -I -B packaging/prepare_python.py --version "${{ matrix.python }}"
          --out "${{ runner.temp }}/sparse-native-python" --report "${{ runner.temp }}/sparse-native-python.json" --github-env
      - name: Original 45 methods in an empty selected-Python environment
        shell: python
        run: |
          import hashlib,importlib.util,json,os,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('python_preparation',pathlib.Path('packaging/prepare_python.py'))
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          selected=os.environ['OUTLANDS_SPARSE_PYTHON']
          env=helper.clean_environment()
          pin=json.loads(pathlib.Path(os.environ['OUTLANDS_SPARSE_PYTHON_RECEIPT']).read_bytes())
          env.update(OUTLANDS_TEST_PYTHON_SHA256=pin['executable_sha256'],OUTLANDS_TEST_PYTHON_VERSION=pin['python_version'])
          subprocess.run([selected,'-I','-B','source_check.py'],env=env,check=True)
          environment=base/'sparse-native-venv'
          subprocess.run([selected,'-I','-B','-m','venv','--without-pip',str(environment)],env=env,check=True)
          python=environment/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
          subprocess.run([str(python),'-I','-B','-W','error','tests/original_support.py','--report',str(base/'sparse-native.json')],env=env,check=True)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sparse-native-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/sparse-native.json
          if-no-files-found: error
