name: Modular web form and interaction integrity checks
on:
  push:
    branches: ['main']
    paths: ['tools/configuration-contract-checker/**', 'tools/form-definition-contract-checker/**', 'tools/form-submission-contract-checker/**', 'tools/ui-transition-history-checker/**', 'tools/ui-interaction-scenario-comparator/**', 'tests/test_web_form_tools.py', '.github/workflows/web-form-checks.yml']
  pull_request:
    paths: ['tools/configuration-contract-checker/**', 'tools/form-definition-contract-checker/**', 'tools/form-submission-contract-checker/**', 'tools/ui-transition-history-checker/**', 'tools/ui-interaction-scenario-comparator/**', 'tests/test_web_form_tools.py', '.github/workflows/web-form-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-web-form:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Form definitions and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/form-definition-contract-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Form submissions and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/form-submission-contract-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: UI transition histories and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/ui-transition-history-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: UI interaction scenarios and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/ui-interaction-scenario-comparator
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and four-tool interoperability
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_web_form_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
