name: Seventy-two-tool install bundle
on:
  pull_request:
    paths:
      - 'integrations/public-tools-bundle-72/**'
      - '.github/workflows/public-tools-bundle-72.yml'
  push:
    branches: ['main']
    paths:
      - 'integrations/public-tools-bundle-72/**'
      - '.github/workflows/public-tools-bundle-72.yml'
  workflow_dispatch:
    inputs:
      public_download:
        description: Download the published ZIP without credentials and fresh-install choices
        required: true
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build backend
        run: python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1
      - name: Fetch the ninety public input wheels without credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/seventy-two-inputs"
          python -B integrations/public-tools-bundle-72/fetch_inputs.py --output "$RUNNER_TEMP/seventy-two-inputs"
      - name: Build deterministic selector and ZIP
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/seventy-two-output"
          python -B integrations/public-tools-bundle-72/build.py --inputs "$RUNNER_TEMP/seventy-two-inputs" --output "$RUNNER_TEMP/seventy-two-output"
      - name: Fresh offline installs and exact archive verification
        shell: bash
        run: python -B integrations/public-tools-bundle-72/verify.py --archive "$RUNNER_TEMP/seventy-two-output/outlands-public-tools-72-1.16.0.zip" --checksums "$RUNNER_TEMP/seventy-two-output/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seventy-two-tool-bundle-${{ runner.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/seventy-two-output/outlands-public-tools-72-1.16.0.zip
            ${{ runner.temp }}/seventy-two-output/SHA256SUMS.txt
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: seventy-two-tool-bundle-*
          path: ${{ runner.temp }}/seventy-two-platforms
      - name: Compare exact ZIP and checksum bytes
        shell: bash
        run: python -B integrations/public-tools-bundle-72/compare.py --artifacts "$RUNNER_TEMP/seventy-two-platforms"
  public-download:
    if: github.event_name == 'workflow_dispatch' && inputs.public_download
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Anonymous public ZIP download and fresh installs
        shell: bash
        run: python -B integrations/public-tools-bundle-72/public_download.py --workspace "$RUNNER_TEMP/public-seventy-two-bundle"
