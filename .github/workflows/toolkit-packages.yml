name: Toolkit source packages
on:
  push:
    branches: ['**']
    tags: ['toolkit-v*']
    paths: ['packages/**', 'catalog/**', 'workshops/**', 'methodology/worked-examples/**', '.github/workflows/toolkit-packages.yml']
  pull_request:
    paths: ['packages/**', 'catalog/**', 'workshops/**', 'methodology/worked-examples/**', '.github/workflows/toolkit-packages.yml']
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify archives and fresh-extraction workflows
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -m unittest discover -s packages/tests -v
      - run: python -B -W error catalog/manage.py check
      - run: python -B -W error -m unittest discover -s catalog/tests -v
      - run: python -B packages/build.py --output "${{ runner.temp }}/toolkit-output"
      - run: python -B packages/release_check.py --output "${{ runner.temp }}/toolkit-output"
      - name: Install separately pinned browser qualification tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r systems/import-migration-workbench/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Install Ubuntu document rendering tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation
      - name: Fresh complete-package system exercises and actual UI qualification
        run: >-
          python -B packages/qualify_system_exercises.py
          --packages "${{ runner.temp }}/toolkit-output"
          --workspace "${{ runner.temp }}/toolkit-system-qualification"
          --evidence "${{ runner.temp }}/toolkit-exercise-evidence"
          --browser ${{ runner.os == 'Linux' && '--render' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: toolkit-exercises-${{ runner.os }}
          path: ${{ runner.temp }}/toolkit-exercise-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: toolkit-${{ runner.os }}
          path: ${{ runner.temp }}/toolkit-output
          if-no-files-found: error
  compare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: toolkit-*
          path: ${{ runner.temp }}/artifacts
      - run: diff "$RUNNER_TEMP/artifacts/toolkit-Linux/SHA256SUMS.txt" "$RUNNER_TEMP/artifacts/toolkit-Windows/SHA256SUMS.txt"
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/toolkit-v')
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: toolkit-Windows
          path: ${{ runner.temp }}/toolkit-output
      - name: Publish the verified toolkit snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B packages/publish.py --output "$RUNNER_TEMP/toolkit-output"
  public-download:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/toolkit-v')
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify actual public assets and fresh intake evidence exercise
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: >-
          python -B packages/verify_published.py
          --workspace "${{ runner.temp }}/public-toolkit-download"
          --evidence "${{ runner.temp }}/public-toolkit-evidence"
      - uses: actions/upload-artifact@v7
        with:
          name: toolkit-public-download-${{ runner.os }}
          path: ${{ runner.temp }}/public-toolkit-evidence
          if-no-files-found: error
