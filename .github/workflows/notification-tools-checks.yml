name: Modular notification and email preparation checks
on:
  push:
    branches: ['main']
    paths: ['tools/message-template-renderer/**', 'tools/message-envelope-checker/**', 'tools/eml-mime-inspector/**', 'tools/delivery-evidence-reconciler/**', 'tools/notification-outbox/**', 'tests/test_notification_tools.py', '.github/workflows/notification-tools-checks.yml']
  pull_request:
    paths: ['tools/message-template-renderer/**', 'tools/message-envelope-checker/**', 'tools/eml-mime-inspector/**', 'tools/delivery-evidence-reconciler/**', 'tools/notification-outbox/**', 'tests/test_notification_tools.py', '.github/workflows/notification-tools-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-messages:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Template rendering and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/message-template-renderer
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Envelope declarations and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/message-envelope-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: MIME inspection and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/eml-mime-inspector
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Delivery evidence and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/delivery-evidence-reconciler
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and public fake-outbox interoperability
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_notification_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
