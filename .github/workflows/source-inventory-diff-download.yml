name: Source Inventory Diff standalone qualification
on:
  push:
    branches: ['main']
    paths: ['tools/source-inventory-diff/**', '.github/workflows/source-inventory-diff-download.yml']
  pull_request:
    paths: ['tools/source-inventory-diff/**', '.github/workflows/source-inventory-diff-download.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  build-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - name: Build committed reviewed source ZIP
        run: python -B tools/source-inventory-diff/packaging/build.py --out "${{ runner.temp }}/inventory-diff-package"
      - uses: actions/upload-artifact@v7
        with:
          name: source-inventory-diff-source
          path: ${{ runner.temp }}/inventory-diff-package/*
          if-no-files-found: error
  archive-inventory-diff-fixtures:
    name: archive-inventory-diff-fixtures (${{ matrix.os }}, ${{ matrix.python }})
    needs: build-source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13', '3.14', '3.15.2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/source-inventory-diff
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OUTLANDS_INVENTORY_DIFF_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: source-inventory-diff-source
          path: ${{ runner.temp }}/downloaded-inventory-diff-package
      - name: Rebuild source with selected Python
        run: python -B packaging/build.py --out "${{ runner.temp }}/rebuilt-inventory-diff-package"
      - name: Fresh extraction, no-pip venv, regression and copied-script CLI qualification
        run: >-
          python -B packaging/qualify.py --packages "${{ runner.temp }}/downloaded-inventory-diff-package"
          --reference-build "${{ runner.temp }}/rebuilt-inventory-diff-package"
          --workspace "${{ runner.temp }}/inventory-diff fresh qualification"
          --report "${{ runner.temp }}/qualification.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inventory-diff-qualification-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
      - name: Documentation links and JSON syntax
        working-directory: .
        run: python -B tools/documentation-check/docs_check.py --root .
