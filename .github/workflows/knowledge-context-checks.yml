name: Modular knowledge and context checks
on:
  push:
    branches: ['main']
    paths: ['tools/context-manifest-checker/**', 'tools/document-chunk-planner/**', 'tools/retrieval-evaluation-calculator/**', 'tools/answer-evidence-checker/**', 'tests/test_knowledge_context_tools.py', '.github/workflows/knowledge-context-checks.yml']
  pull_request:
    paths: ['tools/context-manifest-checker/**', 'tools/document-chunk-planner/**', 'tools/retrieval-evaluation-calculator/**', 'tools/answer-evidence-checker/**', 'tests/test_knowledge_context_tools.py', '.github/workflows/knowledge-context-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-context:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Context manifests and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/context-manifest-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Character chunk planning and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/document-chunk-planner
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Retrieval arithmetic and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/retrieval-evaluation-calculator
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Citation evidence and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/answer-evidence-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and four-tool interoperability
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_knowledge_context_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
