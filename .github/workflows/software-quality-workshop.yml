name: Fictional software quality workshop
on:
  push:
    branches: ['main']
    paths: ['workshops/software_quality_review.py', 'workshops/software-quality-review.md', 'tests/test_software_quality_workshop.py', 'tools/api-request-contract-checker/**', 'tools/api-response-contract-checker/**', 'tools/form-submission-contract-checker/**', 'tools/ui-transition-history-checker/**', 'tools/ui-interaction-scenario-comparator/**', '.github/workflows/software-quality-workshop.yml']
  pull_request:
    paths: ['workshops/software_quality_review.py', 'workshops/software-quality-review.md', 'tests/test_software_quality_workshop.py', 'tools/api-request-contract-checker/**', 'tools/api-response-contract-checker/**', 'tools/form-submission-contract-checker/**', 'tools/ui-transition-history-checker/**', 'tools/ui-interaction-scenario-comparator/**', '.github/workflows/software-quality-workshop.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  selected-observations:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Actual CLI outcomes, hashes and refusal paths
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_software_quality_workshop.py -v
