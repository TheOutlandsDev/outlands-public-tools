name: Modular grouped-report integrity checks
on:
  push:
    branches: ['main']
    paths: ['tools/grouped-report-contract-checker/**', 'tools/group-membership-coverage-checker/**', 'tools/grouped-aggregate-reconciler/**', 'tools/grouped-report-scenario-comparator/**', 'tests/test_grouped_report_tools.py', '.github/workflows/grouped-report-checks.yml']
  pull_request:
    paths: ['tools/grouped-report-contract-checker/**', 'tools/group-membership-coverage-checker/**', 'tools/grouped-aggregate-reconciler/**', 'tools/grouped-report-scenario-comparator/**', 'tests/test_grouped_report_tools.py', '.github/workflows/grouped-report-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-grouped-reports:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Per-module source and native boundary checks
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          for tool in grouped-report-contract-checker group-membership-coverage-checker grouped-aggregate-reconciler grouped-report-scenario-comparator; do
            (cd "tools/$tool" && python -B source_check.py && python -B -W error -m unittest discover -s tests -v)
          done
      - name: Source pins and fictional grouped-report contracts
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_grouped_report_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
