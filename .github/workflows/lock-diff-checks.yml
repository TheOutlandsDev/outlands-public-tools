name: Offline Dependency Lock Diff checks
on:
  push:
    branches: ['main']
    paths: ['tools/dependency-lock-diff/**', 'tests/test_lock_diff.py', '.github/workflows/lock-diff-checks.yml']
  pull_request:
    paths: ['tools/dependency-lock-diff/**', 'tests/test_lock_diff.py', '.github/workflows/lock-diff-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-lock-diffs:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fictional locks, public parser parity, comparisons and privacy
        run: python -B -m unittest discover -s tests -p test_lock_diff.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
