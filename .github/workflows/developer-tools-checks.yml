name: Archive and compiled metadata tools
# ELF-only edits run elf-checks.yml. This batch also runs ELF regressions when
# either new tool or this workflow changes, without doubling ELF-only jobs.
on:
  push:
    branches: ['main']
    paths: ['tools/zip-package-policy/**', 'tools/dotnet-api-diff/**', '.github/workflows/developer-tools-checks.yml']
  pull_request:
    paths: ['tools/zip-package-policy/**', 'tools/dotnet-api-diff/**', '.github/workflows/developer-tools-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  zip-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/zip-package-policy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B source_check.py
      - name: Require PowerShell 7.2 or newer
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.2') { throw 'PowerShell 7.2 or newer is required; ZIP tests are not skipped.' }
          $PSVersionTable.PSVersion.ToString()
      - name: Generated archive, policy and exclusive report tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'zip-policy-fixtures')
      - name: Fictional generated package example
        shell: pwsh
        run: |
          $demo = Join-Path $env:RUNNER_TEMP 'zip-policy-demo'
          ./examples/Make-Demo.ps1 -Destination $demo
          ./Test-ZipPackagePolicy.ps1 -ArchivePath (Join-Path $demo 'package.zip') -PolicyPath (Join-Path $demo 'policy.json')
  dotnet-api:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/dotnet-api-diff
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Obtain exact portable .NET 10 SDK
        run: python -B packaging/sdk.py --version 10.0.404 --out "${{ runner.temp }}/api-sdk"
      - name: Select the isolated SDK for this job
        shell: python
        run: |
          import json, os, pathlib
          root = pathlib.Path(r'${{ runner.temp }}/api-sdk')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(root / 'runtime') + '\n')
          values = dict(DOTNET_ROOT=str(root/'runtime'), DOTNET_CLI_HOME=str(root/'home'), DOTNET_MULTILEVEL_LOOKUP='0', DOTNET_CLI_TELEMETRY_OPTOUT='1', DOTNET_ADD_GLOBAL_TOOLS_TO_PATH='false', DOTNET_GENERATE_ASPNET_CERTIFICATE='false', DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE='true', DOTNET_CLI_USE_MSBUILD_SERVER='0', MSBUILDDISABLENODEREUSE='1', OUTLANDS_API_REQUIRE_NATIVE_LINKS='1')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key,value in values.items(): output.write(key+'='+value+'\n')
          (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'global.json').write_text(json.dumps({'sdk':{'version':'10.0.404','rollForward':'disable','allowPrerelease':False}}))
      - run: python -B source_check.py
      - name: Restore only SDK framework references
        run: dotnet restore tests/ApiDiff.Tests.csproj --configfile NuGet.Config --artifacts-path ../../../.audit/api-diff --nologo
      - name: Build original CLI and generated assembly fixtures
        run: dotnet build tests/ApiDiff.Tests.csproj -c Release --artifacts-path ../../../.audit/api-diff --no-restore --nologo --disable-build-servers -p:UseSharedCompilation=false
      - name: Public declaration, malformed metadata and file tests
        run: dotnet ../../../.audit/api-diff/bin/ApiDiff.Tests/release/ApiDiff.Tests.dll
  elf-hints:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12.16', '3.13.18']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/offline-elf-inspector
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B source_check.py
      - name: Attest version-locked GCC and readelf oracle
        run: python -I -B packaging/prepare_oracle.py --report "${{ runner.temp }}/elf-hints-oracle.json" --github-env
      - name: Preserved 73 tests in a fresh no-pip environment
        shell: python
        run: |
          import hashlib,importlib.util,os,pathlib,subprocess,sys,venv
          spec=importlib.util.spec_from_file_location('oracle_preparation',pathlib.Path('packaging/prepare_oracle.py'))
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          base=pathlib.Path(os.environ['RUNNER_TEMP']);prefix=base/'elf-hints-native-venv'
          venv.EnvBuilder(with_pip=False).create(prefix)
          selected=prefix/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
          env=helper.compiler_environment()
          env.update(OUTLANDS_ELF_REQUIRE_LINKS='1',OUTLANDS_TEST_PYTHON_VERSION='.'.join(map(str,sys.version_info[:3])),OUTLANDS_TEST_PYTHON_SHA256=hashlib.sha256(pathlib.Path(sys._base_executable).read_bytes()).hexdigest())
          subprocess.run([str(selected),'-I','-B','-W','error','tests/original_support.py','--report',str(base/'elf-hints-native.json')],env=env,check=True)
