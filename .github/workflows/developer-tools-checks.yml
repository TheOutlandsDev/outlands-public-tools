name: Archive and compiled metadata tools
# ELF-only edits run elf-checks.yml. This batch also runs ELF regressions when
# either new tool or this workflow changes, without doubling ELF-only jobs.
on:
  push:
    branches: ['main']
    paths: ['tools/zip-package-policy/**', 'tools/dotnet-api-diff/**', '.github/workflows/developer-tools-checks.yml']
  pull_request:
    paths: ['tools/zip-package-policy/**', 'tools/dotnet-api-diff/**', '.github/workflows/developer-tools-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  zip-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/zip-package-policy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B source_check.py
      - name: Require PowerShell 7.2 or newer
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.2') { throw 'PowerShell 7.2 or newer is required; ZIP tests are not skipped.' }
          $PSVersionTable.PSVersion.ToString()
      - name: Generated archive, policy and exclusive report tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'zip-policy-fixtures')
      - name: Fictional generated package example
        shell: pwsh
        run: |
          $demo = Join-Path $env:RUNNER_TEMP 'zip-policy-demo'
          ./examples/Make-Demo.ps1 -Destination $demo
          ./Test-ZipPackagePolicy.ps1 -ArchivePath (Join-Path $demo 'package.zip') -PolicyPath (Join-Path $demo 'policy.json')
  dotnet-api:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/dotnet-api-diff
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Select an installed .NET 8 SDK and fail if unavailable
        shell: python
        run: |
          import json, os, pathlib, re, subprocess
          installed = subprocess.check_output(['dotnet', '--list-sdks'], text=True)
          versions = re.findall(r'^(8\.\d+\.\d+) \[', installed, re.MULTILINE)
          if not versions:
              raise SystemExit('The runner has no installed .NET 8 SDK; required C# tests are not skipped.')
          selected = max(versions, key=lambda value: tuple(map(int, value.split('.'))))
          target = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'global.json'
          with target.open('x', encoding='utf-8') as output:
              json.dump({'sdk': {'version': selected, 'rollForward': 'disable', 'allowPrerelease': False}}, output)
          print('Selected preinstalled .NET SDK ' + selected)
          subprocess.run(['dotnet', '--version'], check=True)
      - run: python -B source_check.py
      - name: Restore only SDK framework references
        run: dotnet restore tests/ApiDiff.Tests.csproj --configfile NuGet.Config --artifacts-path ../../../.audit/api-diff --nologo
      - name: Build original CLI and generated assembly fixtures
        run: dotnet build tests/ApiDiff.Tests.csproj -c Release --artifacts-path ../../../.audit/api-diff --no-restore --nologo
      - name: Public declaration, malformed metadata and file tests
        run: dotnet ../../../.audit/api-diff/bin/ApiDiff.Tests/release/ApiDiff.Tests.dll
  elf-hints:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/offline-elf-inspector
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B source_check.py
      - name: Windows metadata and optional string hint fixtures
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -v
      - name: Ubuntu fixtures and independent GCC/readelf comparison
        if: runner.os == 'Linux'
        env:
          ELF_REQUIRE_ORACLE: '1'
        run: python -B -m unittest discover -s tests -v
