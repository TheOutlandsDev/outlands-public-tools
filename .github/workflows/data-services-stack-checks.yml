name: Generic Data and Services Stack checks
on:
  push:
    paths: ['systems/data-services-stack/**', '.github/workflows/data-services-stack-checks.yml']
  pull_request:
    paths: ['systems/data-services-stack/**', '.github/workflows/data-services-stack-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      STACK_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Application and native filesystem checks
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error systems/data-services-stack/run_checks.py
      - name: Original public component tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error -c "import subprocess,sys; [subprocess.run([sys.executable,'-B','-W','error','-m','unittest','discover','-s',folder,'-v'],check=True) for folder in ('tools/record-ingestion/tests','tools/forecast-baseline-evaluator/tests','tools/notification-outbox/tests')]"
      - name: Install hash-pinned browser test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r systems/data-services-stack/requirements-browser.txt
      - name: Install paired test Chromium and platform dependencies
        run: python -m playwright install --with-deps chromium
      - name: Full fictional Chromium workbench acceptance
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error systems/data-services-stack/run_browser_checks.py
      - name: Browser script syntax
        run: >-
          python -B -c "from pathlib import Path; print(Path('systems/data-services-stack/data_services/ui.html').read_text(encoding='utf-8').split('<script nonce=',1)[1].split('>',1)[1].split('</script>',1)[0])" | node --check
      - name: Fictional persistent restart demo
        run: python -B systems/data-services-stack/stack.py --workspace "${{ runner.temp }}/fictional-stack-demo" demo
      - name: Source manifest
        run: python -B systems/data-services-stack/stack.py source-check
      - name: Package reviewed source
        run: python -B systems/data-services-stack/stack.py package --output "${{ runner.temp }}/data-services-stack-source.zip" > "${{ runner.temp }}/package-receipt.json"
      - name: Show source ZIP receipt
        run: python -B -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig').strip())" "${{ runner.temp }}/package-receipt.json"
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
      - name: Retain reviewed source ZIP and receipt
        uses: actions/upload-artifact@v7
        with:
          name: data-services-stack-source-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/data-services-stack-source.zip
            ${{ runner.temp }}/package-receipt.json
          if-no-files-found: error
          retention-days: 14
