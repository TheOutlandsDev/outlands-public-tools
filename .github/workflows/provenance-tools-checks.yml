name: Modular snapshot and run provenance checks
on:
  push:
    branches: ['main']
    paths: ['tools/run-artifact-manifest-builder/**', 'tools/ingestion-receipt-reconciler/**', 'tools/run-provenance-checker/**', 'tools/publication-plan-checker/**', 'tools/workbook-intake-checker/**', 'tools/snapshot-contract-checker/**', 'tests/test_provenance_tools.py', '.github/workflows/provenance-tools-checks.yml']
  pull_request:
    paths: ['tools/run-artifact-manifest-builder/**', 'tools/ingestion-receipt-reconciler/**', 'tools/run-provenance-checker/**', 'tools/publication-plan-checker/**', 'tools/workbook-intake-checker/**', 'tools/snapshot-contract-checker/**', 'tests/test_provenance_tools.py', '.github/workflows/provenance-tools-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-provenance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Artifact manifest construction and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/run-artifact-manifest-builder
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Intake receipt reconciliation and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/ingestion-receipt-reconciler
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Run lineage and snapshot validation and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/run-provenance-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Publication plan consistency and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/publication-plan-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and connected synthetic provenance flow
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_provenance_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
