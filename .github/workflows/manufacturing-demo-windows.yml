name: Manufacturing Review Demo Windows qualification
on:
  push:
    branches: ['**']
    paths: ['downloads/windows/manufacturing-review-demo/**', '.github/workflows/manufacturing-demo-windows.yml']
  pull_request:
    paths: ['downloads/windows/manufacturing-review-demo/**', '.github/workflows/manufacturing-demo-windows.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Source pins, tamper refusal and fresh focused source execution
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -m unittest discover -s downloads/windows/manufacturing-review-demo -p test_packaging.py -v
      - name: Build exact source and official runtime
        run: python -B downloads/windows/manufacturing-review-demo/build.py --output "${{ runner.temp }}/demo-package"
      - name: Install separate browser qualification tools
        if: runner.os == 'Windows'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r systems/import-migration-workbench/requirements-browser.txt
          python -m playwright install chromium
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r downloads/windows/manufacturing-review-demo/requirements-media.txt
      - name: Actual bundled CMD, offline report, captions and Windows browser recording
        if: runner.os == 'Windows'
        run: python -B downloads/windows/manufacturing-review-demo/accept.py --packages "${{ runner.temp }}/demo-package" --workspace "${{ runner.temp }}/demo-native-acceptance" --browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manufacturing-demo-${{ runner.os }}
          path: ${{ runner.temp }}/demo-package
          if-no-files-found: error
  clean-windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: manufacturing-demo-Windows
          path: ${{ runner.temp }}/demo-package
      - name: Pristine pinned Windows base without Python, then offline bundled launcher
        shell: pwsh
        run: ./downloads/windows/manufacturing-review-demo/clean_windows.ps1 -Packages "${{ runner.temp }}/demo-package" -Workspace "${{ runner.temp }}/python-free-windows"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manufacturing-demo-clean
          path: ${{ runner.temp }}/demo-package/clean-acceptance.json
          if-no-files-found: error
  compare:
    needs: [build, clean-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: manufacturing-demo-{Windows,Linux,clean}
          path: ${{ runner.temp }}/platforms
      - name: Exact ZIP equality, actual media and clean Windows proof
        id: publication_scope
        run: echo "publish_requested=true" >> "$GITHUB_OUTPUT"
      - name: Verify qualification without publishing
        if: steps.publication_scope.outputs.publish_requested == 'true'
        run: python -B downloads/windows/manufacturing-review-demo/publish.py --artifacts "$RUNNER_TEMP/platforms" --verify-only
  publish:
    needs: compare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: manufacturing-demo-{Windows,Linux,clean}
          path: ${{ runner.temp }}/platforms
      - name: Publish only the qualified immutable demo
        id: publication_scope
        run: python -B .github/ci/publish_scope.py --path 'downloads/windows/manufacturing-review-demo/**'
      - name: Publish requested package change
        if: steps.publication_scope.outputs.publish_requested == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B downloads/windows/manufacturing-review-demo/publish.py --artifacts "$RUNNER_TEMP/platforms"
  public-download:
    needs: publish
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify all fourteen public assets and a fresh Windows launcher run
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python -B downloads/windows/manufacturing-review-demo/public_verify.py --workspace "${{ runner.temp }}/public-demo" --evidence "${{ runner.temp }}/public-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manufacturing-demo-public-${{ runner.os }}
          path: ${{ runner.temp }}/public-proof
          if-no-files-found: error
