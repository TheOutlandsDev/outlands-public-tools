name: Safe File Mover platform checks
on:
  push:
    branches: ['main']
    paths: ['tools/safe-file-mover/**', '.github/workflows/file-mover-checks.yml']
  pull_request:
    paths: ['tools/safe-file-mover/**', '.github/workflows/file-mover-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/safe-file-mover
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - run: python -m pip install -r packaging/build-requirements.txt
      - name: Build reviewed wheel
        run: python -B packaging/build_wheel.py --out "${{ runner.temp }}/wheel"
      - uses: actions/upload-artifact@v7
        with:
          name: safe-file-mover-wheel
          path: ${{ runner.temp }}/wheel/*
          if-no-files-found: error
  installed-mover-fixtures:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13', '3.14', '3.15.2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/safe-file-mover
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OUTLANDS_MOVER_REQUIRE_NATIVE_FEATURES: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: safe-file-mover-wheel
          path: ${{ runner.temp }}/downloaded-wheel
      - run: python -m pip install -r packaging/build-requirements.txt
      - name: Rebuild and compare exact bytes
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python -B packaging/build_wheel.py --out "${{ runner.temp }}/rebuilt-wheel"
          python -B -c "from pathlib import Path; a=Path(r'${{ runner.temp }}/downloaded-wheel/safe_file_mover-0.2.1-py3-none-any.whl'); b=Path(r'${{ runner.temp }}/rebuilt-wheel/safe_file_mover-0.2.1-py3-none-any.whl'); assert a.read_bytes()==b.read_bytes(), 'WHEEL_BYTES_DIFFER'"
      - name: Fresh installed-wheel safeguard qualification
        run: python -B packaging/qualify_wheel.py --wheel "${{ runner.temp }}/downloaded-wheel/safe_file_mover-0.2.1-py3-none-any.whl" --work-root "${{ runner.temp }}" --report "${{ runner.temp }}/qualification.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mover-qualification-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
      - name: Documentation and JSON syntax
        working-directory: .
        run: python -B tools/documentation-check/docs_check.py --root .
