name: Modular intake and parser checks
on:
  push:
    branches: ['main']
    paths: ['tools/workbook-intake-checker/**', 'tools/snapshot-contract-checker/**', 'tools/xml-workflow-checker/**', 'tools/planner-handoff-checker/**', 'tools/environment-contract-checker/environment_windows.py', 'systems/production-planning-workbench/planning/**', 'tests/intake_parser_acceptance.py', '.github/workflows/intake-parser-tools-checks.yml']
  pull_request:
    paths: ['tools/workbook-intake-checker/**', 'tools/snapshot-contract-checker/**', 'tools/xml-workflow-checker/**', 'tools/planner-handoff-checker/**', 'tools/environment-contract-checker/environment_windows.py', 'systems/production-planning-workbench/planning/**', 'tests/intake_parser_acceptance.py', '.github/workflows/intake-parser-tools-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned public planner dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r tools/planner-handoff-checker/requirements.txt
      - name: Workbook CSV XLSX and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/workbook-intake-checker
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess,sys,tempfile
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          root=parent/'workbook-source-venv'
          assert not root.exists() and root.parent.is_dir()
          subprocess.run([sys.executable,'-I','-B','-m','venv','--without-pip',str(root)],check=True)
          executable=root/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
          probe="import hashlib,importlib.metadata,json,pathlib,sys; p=pathlib.Path(sys._base_executable).resolve(); print(json.dumps(dict(version=sys.version.split()[0],sha256=hashlib.sha256(p.read_bytes()).hexdigest(),fresh=sys.prefix!=sys.base_prefix,distributions=len(list(importlib.metadata.distributions())))))"
          actual=json.loads(subprocess.check_output([str(executable),'-I','-B','-c',probe],text=True))
          assert actual['fresh'] and actual['distributions']==0 and actual['version']==sys.version.split()[0]
          assert actual['sha256']==hashlib.sha256(pathlib.Path(sys._base_executable).resolve().read_bytes()).hexdigest()
          fixtures=parent/'workbook-source-fixtures' if os.name=='nt' else pathlib.Path(tempfile.mkdtemp(prefix='wb-',dir='/tmp')).resolve()
          if os.name=='nt':
              assert not fixtures.exists()
              fixtures.mkdir()
          assert fixtures.is_absolute() and fixtures.resolve()==fixtures and fixtures.is_dir() and not fixtures.is_symlink()
          env={key:value for key,value in os.environ.items() if not key.upper().startswith(('PIP_','PYTHON'))}
          env.update(PYTHONUTF8='1',PYTHONDONTWRITEBYTECODE='1',NO_COLOR='1',OUTLANDS_TEST_PYTHON_SHA256=actual['sha256'],OUTLANDS_TEST_PYTHON_VERSION=actual['version'],OUTLANDS_WORKBOOK_INTAKE_REQUIRE_LINKS='1',OUTLANDS_INTAKE_REQUIRE_LINKS='1',TEMP=str(fixtures),TMP=str(fixtures),TMPDIR=str(fixtures),OUTLANDS_TEST_TEMP=str(fixtures),OUTLANDS_TEST_TEMP_ROOT=str(fixtures))
          subprocess.run([str(executable),'-I','-B','source_check.py'],env=env,check=True)
          subprocess.run([str(executable),'-B','-W','error','-m','unittest','discover','-s','tests','-v'],env=env,check=True)
      - name: Snapshot declaration and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/snapshot-contract-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Workflow graph and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/xml-workflow-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Public planner pins review and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/planner-handoff-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and fictional four-tool walkthrough
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p intake_parser_acceptance.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
