name: Project Workspace platform checks
on:
  push:
    branches: ['main']
    paths: ['tools/project-workspace/**', 'tests/test_public_additions.py', '.github/workflows/workspace-checks.yml']
  pull_request:
    paths: ['tools/project-workspace/**', 'tests/test_public_additions.py', '.github/workflows/workspace-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  platform-workspace-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OUTLANDS_WORKSPACE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Original six workspace regression methods
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: |
          python -B -W error -c "import importlib.util,unittest; spec=importlib.util.spec_from_file_location('original_workspace_fixtures','tests/test_public_additions.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(module.WorkspaceTests)); raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)"
      - name: Portable and native safety methods
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: |
          python -B -W error -c "import os,unittest; result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tools/project-workspace/tests')); allowed={'test_short_name_alias_is_refused_when_available','test_linux_cannot_initialize_native_api','test_posix_fifo_is_refused_before_open','test_posix_links_are_refused_before_copy'}; missing=os.name=='nt' and any(test._testMethodName not in allowed for test,reason in result.skipped); raise SystemExit(0 if result.wasSuccessful() and not missing else 1)"
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
