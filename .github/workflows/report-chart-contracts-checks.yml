name: Modular report and chart contract checks
on:
  push:
    branches: ['main']
    paths: ['tools/report-parameter-contract-checker/**', 'tools/report-dataset-binding-checker/**', 'tools/chart-encoding-contract-checker/**', 'tools/report-chart-coverage-reconciler/**', 'tests/test_report_chart_contracts.py', '.github/workflows/report-chart-contracts-checks.yml']
  pull_request:
    paths: ['tools/report-parameter-contract-checker/**', 'tools/report-dataset-binding-checker/**', 'tools/chart-encoding-contract-checker/**', 'tools/report-chart-coverage-reconciler/**', 'tests/test_report_chart_contracts.py', '.github/workflows/report-chart-contracts-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Exact local source pins
        shell: bash
        run: |
          for tool in report-parameter-contract-checker report-dataset-binding-checker chart-encoding-contract-checker report-chart-coverage-reconciler; do
            (cd "tools/$tool" && python -B source_check.py)
          done
      - name: Fictional CLI and failure boundaries
        run: python -B -W error -m unittest discover -s tests -p test_report_chart_contracts.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
