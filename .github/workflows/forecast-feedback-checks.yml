name: Modular forecast evaluation and feedback checks
on:
  push:
    branches: ['main']
    paths: ['tools/forecast-error-analyzer/**', 'tools/prediction-interval-checker/**', 'tools/distribution-comparison-reporter/**', 'tools/recommendation-feedback-reconciler/**', 'tools/forecast-baseline-evaluator/**', 'tests/test_forecast_feedback_tools.py', '.github/workflows/forecast-feedback-checks.yml']
  pull_request:
    paths: ['tools/forecast-error-analyzer/**', 'tools/prediction-interval-checker/**', 'tools/distribution-comparison-reporter/**', 'tools/recommendation-feedback-reconciler/**', 'tools/forecast-baseline-evaluator/**', 'tests/test_forecast_feedback_tools.py', '.github/workflows/forecast-feedback-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-evaluation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Forecast error arithmetic and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/forecast-error-analyzer
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Supplied interval coverage and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/prediction-interval-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Fixed-bin marginal comparison and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/distribution-comparison-reporter
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Revision-bound feedback and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/recommendation-feedback-reconciler
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and public-baseline interoperability
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_forecast_feedback_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
