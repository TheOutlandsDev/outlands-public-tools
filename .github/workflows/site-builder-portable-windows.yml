name: Local Site Builder portable Windows qualification
on:
  push:
    paths: ['downloads/windows/local-site-builder/**', '.github/workflows/site-builder-portable-windows.yml']
  pull_request:
    paths: ['downloads/windows/local-site-builder/**', '.github/workflows/site-builder-portable-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Check upstream archive boundaries
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -m unittest discover -s downloads/windows/local-site-builder -p test_packaging.py -v
      - name: Build pinned runtime, dependencies and native SQLite source
        run: python -B downloads/windows/local-site-builder/build.py --output "${{ runner.temp }}/portable-package" --scratch "${{ runner.temp }}/native-site-build"
      - name: Install development-only browser qualification tools separately
        run: |
          npm ci --prefix tools/local-site-builder/browser
          node tools/local-site-builder/browser/node_modules/playwright/cli.js install chromium
      - name: Qualify fresh ZIP under its bundled Node with real native SQLite
        run: python -B downloads/windows/local-site-builder/accept.py --packages "${{ runner.temp }}/portable-package" --workspace "${{ runner.temp }}/portable fresh site" --browser-module "${{ github.workspace }}/tools/local-site-builder/browser/node_modules/playwright"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site-portable-Windows
          path: ${{ runner.temp }}/portable-package
          if-no-files-found: error
  audit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: site-portable-Windows
          path: ${{ runner.temp }}/portable-package
      - name: Independently reconstruct official and locked source inputs
        run: python -B downloads/windows/local-site-builder/verify.py --packages "$RUNNER_TEMP/portable-package" --accepted
  publish:
    needs: audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: site-portable-Windows
          path: ${{ runner.temp }}/portable-package
      - name: Guarded immutable publication after qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B downloads/windows/local-site-builder/publish.py --packages "$RUNNER_TEMP/portable-package"
