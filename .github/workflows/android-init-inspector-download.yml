name: Android Init Service Inspector standalone qualification
on:
  push:
    branches: ['main']
    paths: ['tools/android-init-inspector/**', '.github/workflows/android-init-inspector-download.yml']
  pull_request:
    paths: ['tools/android-init-inspector/**', '.github/workflows/android-init-inspector-download.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  build-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - name: Build exact committed source ZIP
        run: python -I -B tools/android-init-inspector/packaging/build.py --out "${{ runner.temp }}/init-package"
      - uses: actions/upload-artifact@v7
        with:
          name: android-init-inspector-source
          path: ${{ runner.temp }}/init-package/*
          if-no-files-found: error
  archive-init-fixtures:
    name: archive-init-fixtures (${{ matrix.os }}, ${{ matrix.python }})
    needs: build-source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12.16', '3.13.18', '3.14.10', '3.15.2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/android-init-inspector
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OUTLANDS_INIT_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - uses: actions/download-artifact@v8
        with:
          name: android-init-inspector-source
          path: ${{ runner.temp }}/downloaded-init-package
      - name: Prepare hash-pinned selected Python in a new owned prefix
        run: >-
          python -I -B packaging/prepare_python.py --version "${{ matrix.python }}"
          --out "${{ runner.temp }}/init-python" --report "${{ runner.temp }}/init-python.json" --github-env
      - name: Rebuild source with selected Python
        shell: python
        run: |
          import importlib.util,os,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('python_preparation',pathlib.Path('packaging/prepare_python.py'))
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          subprocess.run([os.environ['OUTLANDS_INIT_PYTHON'],'-I','-B','packaging/build.py','--out',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'rebuilt-init-package')],env=helper.clean_environment(),check=True)
      - name: Fresh extracted source and fictional literal init qualification
        shell: python
        run: |
          import importlib.util,os,pathlib,subprocess,sys
          spec=importlib.util.spec_from_file_location('python_preparation',pathlib.Path('packaging/prepare_python.py'))
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          subprocess.run([os.environ['OUTLANDS_INIT_PYTHON'],'-I','-B','packaging/qualify.py',
            '--packages',str(base/'downloaded-init-package'),'--reference-build',str(base/'rebuilt-init-package'),
            '--python-root',str(base/'init-python'),'--python-receipt',str(base/'init-python.json'),'--workspace',str(base/'init fresh qualification'),
            '--report',str(base/'qualification.json')],env=helper.clean_environment(),check=True)
      - name: Bounded qualification failure diagnostics
        if: failure()
        shell: python
        run: |
          import os,pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          file=base/'init fresh qualification'/'qualification-private.log'
          if file.is_file():
              text=file.read_text(encoding='utf-8',errors='replace')[-20000:]
              for path in (str(pathlib.Path.cwd().resolve()),str(base),str(pathlib.Path.home())):
                  text=text.replace(path,'<OWNED_PATH>')
              print(text)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: init-qualification-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
      - name: Documentation links and JSON syntax
        working-directory: .
        run: python -B tools/documentation-check/docs_check.py --root .
