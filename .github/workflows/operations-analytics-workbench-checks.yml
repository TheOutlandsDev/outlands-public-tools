name: Operations Analytics Workbench checks
on:
  push:
    branches: ['main']
    paths: ['systems/operations-analytics-workbench/**', 'systems/production-planning-workbench/**', '.github/workflows/operations-analytics-workbench-checks.yml']
  pull_request:
    paths: ['systems/operations-analytics-workbench/**', 'systems/production-planning-workbench/**', '.github/workflows/operations-analytics-workbench-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-analytics:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      WORKBENCH_REQUIRE_LINKS: '1'
      WORKBENCH_REQUIRE_HANDOFF: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-pinned browser test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r systems/operations-analytics-workbench/requirements-browser.txt
      - name: Install companion planning dependencies for actual handoff acceptance
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r systems/production-planning-workbench/requirements.txt
      - name: Install paired Chromium
        run: python -m playwright install --with-deps chromium
      - name: Application and native I/O checks
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error systems/operations-analytics-workbench/run_checks.py
      - name: Browser script syntax
        run: >-
          python -B -c "from pathlib import Path; print(Path('systems/operations-analytics-workbench/operations_analytics/ui.html').read_text(encoding='utf-8').split('<script>',1)[1].split('</script>',1)[0])" | node --check
      - name: Real fictional Chromium workflows
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error systems/operations-analytics-workbench/run_browser_checks.py
      - name: Complete fictional workflow
        run: python -B systems/operations-analytics-workbench/workbench.py --workspace "${{ runner.temp }}/fictional-analytics-demo" demo
      - name: Pinned source inventory
        run: python -B systems/operations-analytics-workbench/release_source.py check
      - name: Deterministic source package
        run: python -B systems/operations-analytics-workbench/release_source.py package --output "${{ runner.temp }}/operations-analytics-workbench-source.zip" > "${{ runner.temp }}/package-receipt.json"
      - name: Show source receipt
        run: python -B -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig').strip())" "${{ runner.temp }}/package-receipt.json"
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
      - name: Retain focused source and receipt
        uses: actions/upload-artifact@v7
        with:
          name: operations-analytics-workbench-source-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/operations-analytics-workbench-source.zip
            ${{ runner.temp }}/package-receipt.json
          if-no-files-found: error
          retention-days: 14
