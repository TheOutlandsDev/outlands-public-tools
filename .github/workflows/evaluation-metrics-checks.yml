name: Evaluation Metrics Calculator checks
on:
  push:
    paths: ['tools/evaluation-metrics-calculator/**', 'tests/test_evaluation_metrics.py', 'tests/test_public_additions.py', '.github/workflows/evaluation-metrics-checks.yml']
  pull_request:
    paths: ['tools/evaluation-metrics-calculator/**', 'tests/test_evaluation_metrics.py', 'tests/test_public_additions.py', '.github/workflows/evaluation-metrics-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-metrics:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fictional arithmetic, undefined ratios and privacy
        run: python -B -m unittest discover -s tests -p test_evaluation_metrics.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
