name: Modular time series integrity checks
on:
  push:
    branches: ['main']
    paths: ['tools/time-series-grid-checker/**', 'tools/rolling-origin-backtest-planner/**', 'tools/point-in-time-observation-resolver/**', 'tools/feature-window-lineage-checker/**', 'tools/forecast-baseline-evaluator/**', 'tests/test_timeseries_integrity_tools.py', '.github/workflows/timeseries-integrity-checks.yml']
  pull_request:
    paths: ['tools/time-series-grid-checker/**', 'tools/rolling-origin-backtest-planner/**', 'tools/point-in-time-observation-resolver/**', 'tools/feature-window-lineage-checker/**', 'tools/forecast-baseline-evaluator/**', 'tests/test_timeseries_integrity_tools.py', '.github/workflows/timeseries-integrity-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-timeseries:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Time grid coverage and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/time-series-grid-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Rolling origin folds and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/rolling-origin-backtest-planner
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Point in time revisions and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/point-in-time-observation-resolver
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Feature window lineage and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/feature-window-lineage-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and four-tool interoperability
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_timeseries_integrity_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
