name: Multi-tool batch checks
on:
  push:
    branches: ['main']
    paths: ['tools/source-inventory/**', 'tools/resource-monitor/**', 'tools/hash-journal/**', '.github/workflows/multi-tool-checks.yml']
  pull_request:
    paths: ['tools/source-inventory/**', 'tools/resource-monitor/**', 'tools/hash-journal/**', '.github/workflows/multi-tool-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  python-browser-client:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      RESOURCE_MONITOR_REQUIRE_LIVE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install the separately licensed live-metrics dependency
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/resource-monitor/requirements-live.txt
      - name: Verify explicit source inventories
        run: |
          python -B tools/source-inventory/source_check.py
          python -B tools/resource-monitor/source_check.py
      - name: Filesystem and tree-export fixtures
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -m unittest discover -s tools/source-inventory/tests -v
      - name: Sampling, live metrics and actual loopback HTTP fixtures
        working-directory: tools/resource-monitor
        run: python -B -m unittest discover -s tests -v
      - name: JavaScript presentation fixtures
        working-directory: tools/resource-monitor
        run: node --test tests/frontend.test.mjs
      - name: Fictional dashboard sample
        working-directory: tools/resource-monitor
        run: python -B -m resource_monitor demo
      - name: Bounded native aggregate sampling CLI
        working-directory: tools/resource-monitor
        run: python -B -c "import json, subprocess, sys; r=subprocess.run([sys.executable,'-B','-m','resource_monitor','sample','--live','--count','3','--interval','0.2'],capture_output=True,text=True,check=True); d=json.loads(r.stdout); assert d['mode']=='live' and len(d['samples'])==3; print('PASS - bounded native sampling; readings kept private')"
  hash-journal:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/hash-journal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Obtain exact portable .NET 10 SDK
        run: python -B packaging/sdk.py --version 10.0.404 --out "${{ runner.temp }}/hash-sdk"
      - name: Select the isolated SDK for this job
        shell: python
        run: |
          import json, os, pathlib
          root = pathlib.Path(r'${{ runner.temp }}/hash-sdk')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(root / 'runtime') + '\n')
          values = dict(DOTNET_ROOT=str(root/'runtime'), DOTNET_CLI_HOME=str(root/'home'), DOTNET_MULTILEVEL_LOOKUP='0', DOTNET_CLI_TELEMETRY_OPTOUT='1', DOTNET_ADD_GLOBAL_TOOLS_TO_PATH='false', DOTNET_GENERATE_ASPNET_CERTIFICATE='false', DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE='true', DOTNET_CLI_USE_MSBUILD_SERVER='0', MSBUILDDISABLENODEREUSE='1', OUTLANDS_HASH_REQUIRE_NATIVE_LINKS='1')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key,value in values.items(): output.write(key+'='+value+'\n')
          (pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'global.json').write_text(json.dumps({'sdk':{'version':'10.0.404','rollForward':'disable','allowPrerelease':False}}))
      - run: python -B source_check.py
      - name: Restore only SDK framework references (no package feeds)
        run: dotnet restore tests/HashJournal.Tests.csproj --configfile NuGet.Config --artifacts-path ../../../.audit/hash-journal --nologo
      - name: Build original CLI and console fixtures
        run: dotnet build tests/HashJournal.Tests.csproj -c Release --artifacts-path ../../../.audit/hash-journal --no-restore --nologo --disable-build-servers -p:UseSharedCompilation=false
      - name: Strict format, hash, mutation, anchor and file fixtures
        run: dotnet ../../../.audit/hash-journal/bin/HashJournal.Tests/release/HashJournal.Tests.dll
      - name: Fictional journal demo
        run: dotnet ../../../.audit/hash-journal/bin/HashJournal/release/Outlands.HashJournal.dll demo
