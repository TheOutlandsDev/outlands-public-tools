name: Public Release Audit standalone qualification
on:
  push:
    branches: ['main']
    paths: ['tools/public-release-audit/**', '.github/workflows/public-release-audit-download.yml', '.github/ci/probe_audit_dangling.py']
  pull_request:
    paths: ['tools/public-release-audit/**', '.github/workflows/public-release-audit-download.yml', '.github/ci/probe_audit_dangling.py']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  dangling-output-baseline-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - name: Fetch exact frozen-test baseline
        run: git fetch --no-tags --depth=1 origin 3f7f1af3ac561a22d8b430d33db91b8d87b636cc
      - name: Fetch exact historical runtime baseline
        run: git fetch --no-tags --depth=1 origin 2b0e55dfe2f1ba5340a0faeff40c777c9b3d6598
      - name: Compare unchanged report and manifest dangling-link checks
        run: >-
          python -B .github/ci/probe_audit_dangling.py
          --workspace "${{ runner.temp }}/audit baseline probe"
          --report "${{ runner.temp }}/audit-dangling-baseline-probe.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-dangling-baseline-probe
          path: ${{ runner.temp }}/audit-dangling-baseline-probe.json
          if-no-files-found: error
  build-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - name: Build committed reviewed source ZIP
        run: python -B tools/public-release-audit/packaging/build.py --out "${{ runner.temp }}/audit-package"
      - uses: actions/upload-artifact@v7
        with:
          name: public-release-audit-source
          path: ${{ runner.temp }}/audit-package/*
          if-no-files-found: error
  archive-audit-fixtures:
    name: archive-audit-fixtures (${{ matrix.os }}, ${{ matrix.python }})
    needs: build-source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13', '3.14', '3.15.2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/public-release-audit
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OUTLANDS_AUDIT_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: public-release-audit-source
          path: ${{ runner.temp }}/downloaded-audit-package
      - name: Rebuild source with selected Python
        run: python -B packaging/build.py --out "${{ runner.temp }}/rebuilt-audit-package"
      - name: Fresh extraction, no-pip venv, regression and copied-runtime CLI qualification
        run: >-
          python -B packaging/qualify.py --packages "${{ runner.temp }}/downloaded-audit-package"
          --reference-build "${{ runner.temp }}/rebuilt-audit-package"
          --workspace "${{ runner.temp }}/audit fresh qualification"
          --report "${{ runner.temp }}/qualification.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-qualification-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
      - name: Documentation links and JSON syntax
        working-directory: .
        run: python -B tools/documentation-check/docs_check.py --root .
