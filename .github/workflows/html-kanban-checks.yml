name: Modular HTML table and Kanban checks
on:
  push:
    branches: ['main']
    paths: ['tools/html-table-grid-extractor/**', 'tools/html-table-revision-comparator/**', 'tools/kanban-board-state-checker/**', 'tools/kanban-move-planner/**', 'tests/test_html_kanban_tools.py', '.github/workflows/html-kanban-checks.yml']
  pull_request:
    paths: ['tools/html-table-grid-extractor/**', 'tools/html-table-revision-comparator/**', 'tools/kanban-board-state-checker/**', 'tools/kanban-move-planner/**', 'tests/test_html_kanban_tools.py', '.github/workflows/html-kanban-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-html-kanban:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Exact local source pins
        shell: bash
        run: |
          for tool in html-table-grid-extractor html-table-revision-comparator kanban-board-state-checker kanban-move-planner; do
            (cd "tools/$tool" && python -B source_check.py)
          done
      - name: Fictional CLI and failure boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_html_kanban_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
