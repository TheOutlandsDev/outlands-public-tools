name: Workbench download acceptance
on:
  push:
    branches: ['**']
    paths: ['downloads/workbenches/**', '.github/workflows/workbench-downloads.yml']
  pull_request:
    paths: ['downloads/workbenches/**', '.github/workflows/workbench-downloads.yml']
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      WORKBENCH_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build reviewed source objects with outer quick start
        run: python -B -m unittest discover -s downloads/workbenches/tests -v
      - name: Create the exact download candidates
        run: python -B downloads/workbenches/build.py --output "${{ runner.temp }}/workbench-downloads"
      - name: Install existing locked browser development dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r systems/sql-report-workbench/requirements-browser.txt
      - name: Install associated Chromium and platform libraries
        run: python -m playwright install --with-deps chromium
      - name: Fresh ZIP source, core, demo, independent result and browser acceptance
        run: python -B downloads/workbenches/accept.py --packages "${{ runner.temp }}/workbench-downloads" --workspace "${{ runner.temp }}/workbench fresh downloads" --browser
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-download-${{ runner.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/workbench-downloads
          if-no-files-found: error
      - name: Keep only the sanitized acceptance receipt
        uses: actions/upload-artifact@v7
        with:
          name: workbench-acceptance-${{ runner.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/workbench fresh downloads/acceptance.json
          if-no-files-found: error
  compare:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: workbench-download-*
          path: ${{ runner.temp }}/platforms
      - name: Require matching package and matrix bytes on all four platforms
        shell: bash
        run: |
          for file in "$RUNNER_TEMP"/platforms/*/SHA256SUMS.txt; do
            diff "$RUNNER_TEMP/platforms/workbench-download-Linux-3.12/SHA256SUMS.txt" "$file"
          done
  publish:
    if: github.ref == 'refs/heads/main'
    needs: compare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: workbench-download-*
          path: ${{ runner.temp }}/verified-workbenches
      - name: Check publication source scope
        id: publication_scope
        run: >-
          python -B .github/ci/publish_scope.py --path 'downloads/workbenches/**'
      - env:
          GH_TOKEN: ${{ github.token }}
        if: steps.publication_scope.outputs.publish_requested == 'true'
        run: python -B downloads/workbenches/publish.py --artifacts "$RUNNER_TEMP/verified-workbenches"
