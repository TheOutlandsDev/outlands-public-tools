name: Offline Assessment Workbench checks
on:
  push:
    branches: ['main']
    paths: ['tools/assessment-workbench/**', '.github/workflows/assessment-workbench-checks.yml']
  pull_request:
    paths: ['tools/assessment-workbench/**', '.github/workflows/assessment-workbench-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  private-store-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      ASSESSMENT_WORKBENCH_REQUIRE_TK: '1'
    defaults:
      run:
        working-directory: tools/assessment-workbench
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B source_check.py
      - name: Windows persistence, CLI and real Tk fixtures
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -v
      - name: Ubuntu persistence, CLI and real Tk fixtures
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B -m unittest discover -s tests -v
      - name: Source tree still contains only reviewed files
        run: python -B source_check.py
