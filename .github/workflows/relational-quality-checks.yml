name: Modular relational data quality checks
on:
  push:
    branches: ['main']
    paths: ['tools/relational-schema-diff/**', 'tools/key-reference-checker/**', 'tools/join-cardinality-analyzer/**', 'tools/query-result-contract-checker/**', 'tools/workbook-intake-checker/**', 'tests/test_relational_quality_tools.py', '.github/workflows/relational-quality-checks.yml']
  pull_request:
    paths: ['tools/relational-schema-diff/**', 'tools/key-reference-checker/**', 'tools/join-cardinality-analyzer/**', 'tools/query-result-contract-checker/**', 'tools/workbook-intake-checker/**', 'tests/test_relational_quality_tools.py', '.github/workflows/relational-quality-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  fictional-relational:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OUTLANDS_INTAKE_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Schema differences and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/relational-schema-diff
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Key and reference integrity and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/key-reference-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Join cardinality and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/join-cardinality-analyzer
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Query result contracts and native boundaries
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: tools/query-result-contract-checker
        run: |
          python -B source_check.py
          python -B -W error -m unittest discover -s tests -v
      - name: Actual standalone CLI and four-tool interoperability
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -W error -m unittest discover -s tests -p test_relational_quality_tools.py -v
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
