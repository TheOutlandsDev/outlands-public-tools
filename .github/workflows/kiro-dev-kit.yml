name: Kiro development kit checks
on:
  pull_request:
    paths:
      - 'integrations/kiro-dev-kit/**'
      - '.github/workflows/kiro-dev-kit.yml'
  push:
    branches: ['main']
    paths:
      - 'integrations/kiro-dev-kit/**'
      - '.github/workflows/kiro-dev-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
jobs:
  portable-kit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27.0.1'
      - name: Optional pinned SDK dependencies for offline transport checks
        run: python -m pip install --disable-pip-version-check -r integrations/kiro-dev-kit/requirements-bedrock-check.txt
      - name: Installer, restore, routing, and negative evaluation tests
        run: python -B -m unittest discover -s integrations/kiro-dev-kit/tests -v
      - name: Language fixtures and deliberate failure detection
        run: python -B integrations/kiro-dev-kit/scripts/kiro_kit.py check-fixtures
      - name: PowerShell wrapper journey
        shell: pwsh
        run: ./integrations/kiro-dev-kit/tests/test_powershell.ps1 -Python (Get-Command python).Source
      - name: Read-only laptop inspection contract
        shell: pwsh
        run: ./integrations/kiro-dev-kit/tests/test_laptop_inspection.ps1
      - name: Repository and preinstall probe contract
        shell: pwsh
        run: ./integrations/kiro-dev-kit/tests/test_repository_probe.ps1
      - name: Windows PowerShell 5.1 inspection contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -File integrations/kiro-dev-kit/tests/test_laptop_inspection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File integrations/kiro-dev-kit/tests/test_repository_probe.ps1
      - name: Bedrock plan and in-memory SDK pairing
        run: |
          python -B integrations/kiro-dev-kit/scripts/check_bedrock.py --plan integrations/kiro-dev-kit/pairing-plan.example.json
          python -B integrations/kiro-dev-kit/scripts/check_bedrock.py --probe-sdk
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
