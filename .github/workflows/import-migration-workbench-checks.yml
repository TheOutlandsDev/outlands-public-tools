name: Import Migration Workbench checks
on:
  push:
    paths: ['systems/import-migration-workbench/**', '.github/workflows/import-migration-workbench-checks.yml']
  pull_request:
    paths: ['systems/import-migration-workbench/**', '.github/workflows/import-migration-workbench-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fictional-migration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      WORKBENCH_REQUIRE_LINKS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Application and native I/O checks
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error systems/import-migration-workbench/run_checks.py
      - name: Install hash-pinned browser test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r systems/import-migration-workbench/requirements-browser.txt
      - name: Install paired test Chromium and platform dependencies
        run: python -m playwright install --with-deps chromium
      - name: Real Chromium preview, import, verification and private handoff acceptance
        env:
          OUTLANDS_TEST_TEMP: ${{ runner.temp }}
        run: python -B -W error systems/import-migration-workbench/run_browser_checks.py
      - name: Browser script syntax
        run: >-
          python -B -c "from pathlib import Path; print(Path('systems/import-migration-workbench/migration/ui.html').read_text(encoding='utf-8').split('<script>',1)[1].split('</script>',1)[0])" | node --check
      - name: Complete fictional workflow
        run: python -B systems/import-migration-workbench/workbench.py --workspace "${{ runner.temp }}/fictional-migration-demo" demo
      - name: Pinned source inventory
        run: python -B systems/import-migration-workbench/release_source.py check
      - name: Deterministic source package
        run: python -B systems/import-migration-workbench/release_source.py package --output "${{ runner.temp }}/import-migration-workbench-source.zip" > "${{ runner.temp }}/package-receipt.json"
      - name: Show source receipt
        run: python -B -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig').strip())" "${{ runner.temp }}/package-receipt.json"
      - name: Documentation and JSON syntax
        run: python -B tools/documentation-check/docs_check.py --root .
      - name: Retain focused source and receipt
        uses: actions/upload-artifact@v7
        with:
          name: import-migration-workbench-source-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/import-migration-workbench-source.zip
            ${{ runner.temp }}/package-receipt.json
          if-no-files-found: error
          retention-days: 14
