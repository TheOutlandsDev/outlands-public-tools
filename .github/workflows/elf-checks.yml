name: Offline ELF Inspector checks
on:
  push:
    branches: ['main']
    paths: ['tools/offline-elf-inspector/**', '.github/workflows/elf-checks.yml']
  pull_request:
    paths: ['tools/offline-elf-inspector/**', '.github/workflows/elf-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  inspector:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12.16', '3.13.18']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/offline-elf-inspector
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - run: python -B source_check.py
      - name: Prepare hash-pinned selected Python in a new owned prefix
        run: >-
          python -I -B packaging/prepare_python.py --version "${{ matrix.python }}"
          --out "${{ runner.temp }}/elf-legacy-python" --report "${{ runner.temp }}/elf-legacy-python.json" --github-env
      - name: Attest version-locked GCC and readelf oracle
        run: python -I -B packaging/prepare_oracle.py --report "${{ runner.temp }}/elf-legacy-oracle.json" --github-env
      - name: Preserved 73 tests in a fresh no-pip environment
        shell: python
        run: |
          import hashlib,importlib.util,json,os,pathlib,subprocess,sys
          spec=importlib.util.spec_from_file_location('oracle_preparation',pathlib.Path('packaging/prepare_oracle.py'))
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          base=pathlib.Path(os.environ['RUNNER_TEMP']);prefix=base/'elf-legacy-native-venv'
          env=helper.compiler_environment();assert not prefix.exists()
          subprocess.run([os.environ['OUTLANDS_ELF_PYTHON'],'-I','-B','-m','venv','--without-pip',str(prefix)],env=env,check=True)
          prepared=json.loads((base/'elf-legacy-python.json').read_bytes())
          selected=prefix/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
          env=helper.compiler_environment()
          env.update(OUTLANDS_ELF_REQUIRE_LINKS='1',OUTLANDS_TEST_PYTHON_VERSION=prepared['python_version'],OUTLANDS_TEST_PYTHON_SHA256=prepared['executable_sha256'])
          subprocess.run([str(selected),'-I','-B','-W','error','tests/original_support.py','--report',str(base/'elf-legacy-native.json')],env=env,check=True)
      - name: Generate and verify a clean report with selected Python
        shell: python
        run: |
          import hashlib,importlib.util,json,os,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('oracle_preparation',pathlib.Path('packaging/prepare_oracle.py'))
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          base=pathlib.Path(os.environ['RUNNER_TEMP']);demo=base/'elf-legacy-demo';report=base/'elf-legacy-report'
          python=os.environ['OUTLANDS_ELF_PYTHON'];env=helper.compiler_environment()
          subprocess.run([python,'-I','-B','examples/make_demo.py','--destination',str(demo),'--clean'],env=env,check=True)
          subprocess.run([python,'-I','-B','elf_inspector.py','--file',str(demo/'app/demo.elf'),'--root',str(demo/'lib'),'--sha256','--output',str(report)],env=env,check=True)
          manifest=json.loads((report/'MANIFEST.json').read_bytes());assert len(manifest['files'])==3
          assert all((report/row['path']).stat().st_size==row['bytes'] and hashlib.sha256((report/row['path']).read_bytes()).hexdigest()==row['sha256'] for row in manifest['files'])
          assert json.loads((report/'report.json').read_bytes())['status']=='NO_SCOPE_FINDINGS'
