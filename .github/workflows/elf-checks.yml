name: Offline ELF Inspector checks
on:
  push:
    branches: ['main']
    paths: ['tools/offline-elf-inspector/**', '.github/workflows/elf-checks.yml']
  pull_request:
    paths: ['tools/offline-elf-inspector/**', '.github/workflows/elf-checks.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
permissions:
  contents: read
jobs:
  inspector:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12.16', '3.13.18']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/offline-elf-inspector
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B source_check.py
      - name: Attest version-locked GCC and readelf oracle
        run: python -I -B packaging/prepare_oracle.py --report "${{ runner.temp }}/elf-legacy-oracle.json" --github-env
      - name: Preserved 73 tests in a fresh no-pip environment
        shell: python
        run: |
          import hashlib,importlib.util,os,pathlib,subprocess,sys,venv
          spec=importlib.util.spec_from_file_location('oracle_preparation',pathlib.Path('packaging/prepare_oracle.py'))
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          base=pathlib.Path(os.environ['RUNNER_TEMP']);prefix=base/'elf-legacy-native-venv'
          venv.EnvBuilder(with_pip=False).create(prefix)
          selected=prefix/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
          env=helper.compiler_environment()
          env.update(OUTLANDS_ELF_REQUIRE_LINKS='1',OUTLANDS_TEST_PYTHON_VERSION='.'.join(map(str,sys.version_info[:3])),OUTLANDS_TEST_PYTHON_SHA256=hashlib.sha256(pathlib.Path(sys._base_executable).read_bytes()).hexdigest())
          subprocess.run([str(selected),'-I','-B','-W','error','tests/original_support.py','--report',str(base/'elf-legacy-native.json')],env=env,check=True)
      - name: Generate and verify a clean report
        run: |
          python -B examples/make_demo.py --destination ../ci-elf-demo --clean
          python -B elf_inspector.py --file ../ci-elf-demo/app/demo.elf --root ../ci-elf-demo/lib --sha256 --output ../ci-elf-report
          python -B -c "import pathlib,json,hashlib; p=pathlib.Path('../ci-elf-report'); m=json.loads((p/'MANIFEST.json').read_text()); assert len(m['files'])==3; assert all((p/r['path']).stat().st_size==r['bytes'] and hashlib.sha256((p/r['path']).read_bytes()).hexdigest()==r['sha256'] for r in m['files']); assert json.loads((p/'report.json').read_text())['status']=='NO_SCOPE_FINDINGS'; print('REPORT VERIFIED')"
