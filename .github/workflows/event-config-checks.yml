name: Event and configuration review checks
on:
  push:
    paths: ['tools/windows-event-timeline/**', 'tools/android-property-diff/**', 'tools/permission-manifest-diff/**', '.github/workflows/event-config-checks.yml']
  pull_request:
    paths: ['tools/windows-event-timeline/**', 'tools/android-property-diff/**', 'tools/permission-manifest-diff/**', '.github/workflows/event-config-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-config:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact reviewed source-only inventories
        run: |
          python -B tools/windows-event-timeline/source_check.py
          python -B tools/android-property-diff/source_check.py
          python -B tools/permission-manifest-diff/source_check.py
      - name: Saved event JSON/XML, exact time and actual CLI fixtures
        working-directory: tools/windows-event-timeline
        run: python -B -W error -m unittest discover -s tests -v
      - name: Property grammar, ambiguity and actual CLI fixtures
        working-directory: tools/android-property-diff
        run: python -B -W error -m unittest discover -s tests -v
      - name: Permission metadata, uncertainty and actual CLI fixtures
        working-directory: tools/permission-manifest-diff
        run: python -B -W error -m unittest discover -s tests -v
